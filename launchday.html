    <style>

      
/* CSS mouse */

    .pointer {
      position: fixed;
      top: 0;
      left: 0;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      pointer-events: none;
      z-index: 9999;
      opacity: 1; /* Always visible */
      transform: translate(-50%, -50%) scale(1);
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.25s ease;
    }

    .pointer.grow {
      transform: translate(-50%, -50%) scale(2.5);
      background: rgba(255, 255, 255, 0.03);
    }

      :root {
        --bg: #0e0e0e;
        --bg-light: #181818;
        --accent: #f9a826;
        --text: #ffffff;
        --muted: #b5b5b5;
        --section-padding: clamp(5rem, 12vw, 8rem);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        font-family: "Urbanist", "Inter", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.55;
        overflow-x: hidden;
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      /* ===== Header ===== */
      header {
        position: fixed;
        inset: 0 0 auto 0;
        padding: 1.2rem 2rem;
        backdrop-filter: blur(10px);
        background: rgba(14, 14, 14, 0.4);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 1000;
      }

      .logo {
        font-size: 1.7rem;
        font-weight: 700;
        letter-spacing: 1px;
        color: var(--accent);
      }

      .nav {
        display: flex;
        gap: 2.5rem;
        list-style: none;
      }

      .nav a {
        position: relative;
        font-weight: 500;
      }

      .nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -3px;
        width: 100%;
        height: 2px;
        background: var(--accent);
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 0.3s ease;
      }

      .nav a:hover::after {
        transform: scaleX(1);
      }

      /* ===== Hero ===== */
      .hero {
        height: 100vh;
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;

      }
      model-viewer {
  width: 100%;
  height: 100%;
  position: absolute;
  top: 0;
  left: 0;
  z-index: 0;
  opacity: 0.3;
}


      canvas#bgCanvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        z-index: -2;
      }

      .hero-overlay {
        position: absolute;
        inset: 0;
        background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0) 0%, rgba(0, 0, 0, 0.75) 75%);
        backdrop-filter: blur(2px);
        z-index: -1;
      }

      .hero h1 {
        font-size: clamp(2.8rem, 7vw, 5rem);
        font-weight: 700;
      }

      .typed-wrap {
        margin-top: 1.2rem;
        font-size: 1.35rem;
        height: 32px;
        color: var(--accent);
      }

      .btn {
        display: inline-block;
        margin-top: 2rem;
        padding: 0.95rem 2.6rem;
        background: var(--accent);
        color: #000;
        font-weight: 600;
        letter-spacing: 0.5px;
        border-radius: 50px;
        transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .btn:hover {
        transform: translateY(-4px);
      }

      /* ===== Ticker ===== */
      .ticker {
        width: 100%;
        overflow: hidden;
        border-top: 1px solid #222;
        border-bottom: 1px solid #222;
        background: var(--bg-light);
      }

      .ticker__inner {
        display: inline-flex;
        gap: 3rem;
        padding: 1rem 0;
        white-space: nowrap;
        animation: scroll 18s linear infinite;
        font-weight: 500;
        letter-spacing: 1px;
        color: var(--muted);
      }

      @keyframes scroll {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-100%);
        }
      }

      /* ===== Sections ===== */
      section {
        padding: var(--section-padding) 1.5rem;
        max-width: 1200px;
        margin-inline: auto;
      }

      .section-title {
        font-size: 2.4rem;
        text-align: center;
        margin-bottom: 3rem;
      }

      /* Service Cards */
      .services-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      }

      .service-card {
        background: var(--bg-light);
        padding: 2.5rem 1.8rem;
        border-radius: 1.2rem;
        text-align: center;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
        transform-style: preserve-3d;
        transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      }

      .service-card:hover {
        transform: translateY(-12px) rotateX(6deg) rotateY(-6deg);
      }

      .service-card svg {
        width: 56px;
        height: 56px;
        stroke: var(--accent);
        margin-bottom: 1rem;
      }

      .service-card h3 {
        margin-bottom: 0.7rem;
      }

      .service-card p {
        color: var(--muted);
        font-size: 0.95rem;
      }

      /* Highlights */
      .highlight-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      }

      .highlight-card {
        position: relative;
        overflow: hidden;
        border-radius: 1rem;
        isolation: isolate;
      }

      .highlight-card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: transform 1.1s ease;
      }

      .highlight-card:hover img {
        transform: scale(1.12);
      }

      .highlight-caption {
        position: absolute;
        bottom: 0;
        width: 100%;
        padding: 1rem 1.2rem;
        background: rgba(0, 0, 0, 0.65);
        font-weight: 500;
      }

      /* Why Choose */
      .why-grid {
        display: grid;
        gap: 2rem;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }

      .why-item {
        background: var(--bg-light);
        padding: 2rem 1.6rem;
        border-left: 4px solid var(--accent);
        border-radius: 0 1rem 1rem 0;
      }

      /* Testimonials */
      .testimonial {
        max-width: 800px;
        margin-inline: auto;
        text-align: center;
        font-style: italic;
        color: var(--muted);
      }

      .testimonial cite {
        display: block;
        margin-top: 1rem;
        font-weight: 600;
        color: var(--accent);
        font-style: normal;
      }

      /* CTA */
      .cta {
        background: linear-gradient(135deg, var(--accent) 0%, #ffd86b 100%);
        color: #000;
        text-align: center;
        padding: 4.5rem 1.5rem;
        border-radius: 1rem;
      }

      .cta .btn-dark {
        margin-top: 1.5rem;
        background: #000;
        color: #fff;
      }

      /* Footer */
      footer {
        background: #000;
        padding: 2.2rem 1.5rem;
        text-align: center;
        font-size: 0.9rem;
        color: #777;
      }

      footer nav {
        margin-bottom: 1rem;
        display: inline-flex;
        gap: 1.6rem;
      }

      footer a:hover {
        color: var(--accent);
      }

      /* Mobile Nav */
      .burger {
        display: none;
        flex-direction: column;
        gap: 6px;
        cursor: pointer;
      }

      .burger span {
        width: 26px;
        height: 2px;
        background: var(--text);
        transition: transform 0.4s, opacity 0.4s;
      }

      @media (max-width: 768px) {
        .nav {
          position: fixed;
          top: 0;
          right: -100%;
          width: 70%;
          height: 100vh;
          background: var(--bg);
          flex-direction: column;
          justify-content: center;
          align-items: center;
          gap: 2rem;
          transition: right 0.45s cubic-bezier(0.22, 1, 0.36, 1);
          z-index: 1050;
        }

        .nav.open {
          right: 0;
        }

        .burger {
          display: flex;
          z-index: 1100;
        }
      }

.burger.open span:nth-child(1) {
  transform: translateY(8px) rotate(45deg);
}
.burger.open span:nth-child(2) {
  opacity: 0;
}
.burger.open span:nth-child(3) {
  transform: translateY(-8px) rotate(-45deg);
}

      /* Contact Form Improved Styles */
.contact-form {

.contact-form input,

  font-size: 1rem;

.contact-form input:focus,

.contact-form select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='16' height='16' fill='gray' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M4 6l4 4 4-4' stroke='gray' stroke-width='2' fill='none' fill-rule='evenodd'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 1rem center;
  background-size: 1.1em;
}

.contact-form textarea {
  min-height: 110px;

.contact-form button[type="submit"] {
  background: var(--accent);
  color: #000;

  border: none;
  border-radius: 2rem;

  font-size: 1.1rem;
  cursor: pointer;
  transition: background 0.2s, color 0.2s, transform 0.2s;
  box-shadow: 0 2px 8px rgba(0,0,0,0.10);

.contact-form button[type="submit"]:hover {

  color: #222;
  transform: translateY(-2px) scale(1.03);

  <div class="pointer" id="pointer"></div>













  <script>
    // mouse cursor effect
const pointer = document.getElementById("pointer");

// Detect if the device supports a mouse pointer (not mobile)
const supportsHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;

if (supportsHover) {
  let mouseX = window.innerWidth / 2;
  let mouseY = window.innerHeight / 2;
  let pointerX = mouseX;
  let pointerY = mouseY;

  document.addEventListener("mousemove", e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
  });

  function animatePointer() {
    // Lerp for smooth delay (0.15 = more delay, 1 = instant)
    pointerX += (mouseX - pointerX) * 0.15;
    pointerY += (mouseY - pointerY) * 0.15;
    pointer.style.left = `${pointerX}px`;
    pointer.style.top = `${pointerY}px`;
    requestAnimationFrame(animatePointer);
  }
  animatePointer();

  // Only scale on hover
  const hoverTargets = document.querySelectorAll("a, button, [data-hover]");
  hoverTargets.forEach(el => {
    el.addEventListener("mouseenter", () => {
      pointer.classList.add("grow");
    });
    el.addEventListener("mouseleave", () => {
      pointer.classList.remove("grow");
    });
  });
} else {
  // Hide pointer on mobile or touch devices
  pointer.style.display = "none";
}

  </script>
