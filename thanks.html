<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thank You - Festus Live</title>
  <style>
    /* Reset */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', Arial, sans-serif;
      background-color: #0e0e0e;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      flex-direction: column;
      padding: 20px;
    }

    .container {
      background: #1a1a1a;
      padding: 40px;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.6);
      max-width: 500px;
      width: 100%;
      animation: fadeIn 1s ease-in-out;
    }

    .logo {
      font-size: 28px;
      font-weight: bold;
      color: #ffcc00;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 15px;
      color: #ffcc00;
    }

    p {
      font-size: 1rem;
      margin-bottom: 15px;
      color: #cccccc;
    }

    .redirect {
      font-size: 0.9rem;
      color: #999;
      margin-top: 10px;
    }

    .loader {
      border: 4px solid #333;
      border-top: 4px solid #ffcc00;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsive */
    @media(max-width: 600px) {
      h1 { font-size: 1.8rem; }
      p { font-size: 0.9rem; }
      .container { padding: 25px; }
    }
  </style>
  <script>
    // Redirect after 5 seconds
    setTimeout(function() {
      window.location.href = "https://festuslive.com/";
    }, 3000);
  </script>
</head>
<body>
 <center> <div class="container">
   
    <h1>Thank You!🎉</h1>

    <p>for contacting us.<br>We’ll get back to you shortly.</p>
    <div class="loader"></div>
   <center> <p class="redirect">Redirecting to the homepage in a few seconds...</p></center>
  </div></center>
</body>
</html>
