<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Latest Show</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.css" />
  <style>
/* Section */
.latest-show {
  padding: 60px 20px;
  background: transparent; /* ✅ no background */
  color: #fff;
}

/* Wrapper (poster + booking) */
.show-wrapper {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
  max-width: 1100px;
  margin: auto;
}

/* Poster Slider */
.poster {
  width: 100%;
  max-width: 500px;
}
.poster img {
  width: 100%;
  border-radius: 15px;
  box-shadow: 0 0 20px rgba(0,0,0,0.15);
  transition: transform 0.4s ease;
}
.poster img:hover {
  transform: scale(1.03);
}

/* Booking Side */
.booking-side {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
}

.book-btn {
  background: #e50914;
  color: white;
  font-size: 1.2rem;
  font-weight: bold;
  padding: 15px 30px;
  border-radius: 12px;
  text-decoration: none;
  transition: 0.3s ease;
  box-shadow: 0 0 15px rgba(229,9,20,0.6);
}
.book-btn:hover {
  background: #b00610;
  transform: scale(1.05);
}

.or-text {
  font-weight: bold;
  font-size: 1rem;
  color: #333;
}

.qr-box img {
  width: 150px;
  height: auto;
  border-radius: 12px;
  box-shadow: 0 0 15px rgba(0,0,0,0.2);
}

/* Responsive */
@media(max-width: 768px) {
  .show-wrapper {
    flex-direction: column;
    gap: 30px;
  }
  .booking-side {
    flex-direction: row;
    justify-content: center;
    gap: 20px;
  }
  .qr-box img {
    width: 100px;
  }
}
  </style>
</head>
<body>
  
<!-- Latest Show Section -->
<section class="latest-show">
  <div class="show-wrapper">
    
    <!-- Poster with slider -->
    <div class="poster">
      <div class="swiper">
        <div class="swiper-wrapper">
          <div class="swiper-slide"><img src="img/1.1.png" alt="Show Poster 1"></div>
          <div class="swiper-slide"><img src="img/FINAL.png" alt="Show Poster 2"></div>
        </div>
      </div>
    </div>
    
    <!-- Booking Options -->
    <div class="booking-side">
      <a href="https://in.bookmyshow.com/events/festuslive-with-rajat-sood/ET00453359" 
         target="_blank" class="book-btn">
        🎟️ Book Now
      </a>
      <span class="or-text">OR</span>
      <div class="qr-box">
        <img src="img/myqr.png" alt="Scan QR for Tickets">
      </div>
    </div>
    
  </div>
</section>

<!-- Swiper JS -->
<script src="https://cdn.jsdelivr.net/npm/swiper/swiper-bundle.min.js"></script>
<script>
  var swiper = new Swiper('.swiper', {
    loop: true,
    autoplay: {
      delay: 2500, // 2.5s auto slide
      disableOnInteraction: false,
    },
    effect: 'slide'
  });
</script>

</body>
</html>
